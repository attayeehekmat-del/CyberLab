<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberLab</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef1f4;
  color: #111;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  width: 92%;
  max-width: 420px;
  background: white;
  padding: 30px;
  border-radius: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,.12);
  text-align: center;
}

.logo {
  width: 65px;
  height: 65px;
  margin: 0 auto 18px;
  border-radius: 50%;
  background: #25d366;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  font-weight: bold;
}

h1 {
  margin: 0 0 8px;
}

.subtitle {
  color: #667781;
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border: 1px solid #ccd0d5;
  border-radius: 9px;
  font-size: 16px;
  text-align: center;
  outline: none;
}

input:focus {
  border-color: #25d366;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 9px;
  background: #25d366;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.back {
  margin-top: 10px;
  background: #e9edef;
  color: #222;
}

.hidden {
  display: none;
}

.result {
  margin-top: 18px;
  padding: 15px;
  background: #e8f5e9;
  border-radius: 9px;
  line-height: 1.8;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">C</div>

  <h1>CyberLab</h1>

  <div class="subtitle">
    شبیه‌ساز آموزشی ورود دو مرحله‌ای
  </div>

  <!-- مرحله شماره -->
  <div id="phonePage">

    <input
      id="phone"
      type="tel"
      inputmode="tel"
      placeholder="شمارهٔ آزمایشی"
      autocomplete="off"
    >

    <button id="next" type="button">
      ادامه
    </button>

  </div>

  <!-- مرحله کد -->
  <div id="codePage" class="hidden">

    <div class="subtitle">
      کد ۶ رقمی آزمایشی را وارد کن
    </div>

    <input
      id="code"
      type="text"
      inputmode="numeric"
      maxlength="6"
      placeholder="------"
      autocomplete="off"
    >

    <button id="submit" type="button">
      تأیید آزمایشی
    </button>

    <button id="back" class="back" type="button">
      برگشت
    </button>

  </div>

  <!-- نتیجه -->
  <div id="result" class="result hidden"></div>

</div>


<script>

const phonePage = document.getElementById("phonePage");
const codePage = document.getElementById("codePage");

const phone = document.getElementById("phone");
const code = document.getElementById("code");

const result = document.getElementById("result");


// رفتن از شماره به کد
document.getElementById("next").addEventListener("click", function() {

  if (!phone.value.trim()) {

    result.classList.remove("hidden");

    result.textContent =
      "لطفاً یک شمارهٔ آزمایشی وارد کن.";

    return;
  }

  phonePage.classList.add("hidden");

  codePage.classList.remove("hidden");

  result.classList.add("hidden");

  code.focus();

});


// بررسی کد آزمایشی
document.getElementById("submit").addEventListener("click", function() {

  const enteredCode = code.value.trim();

  if (!/^\d{6}$/.test(enteredCode)) {

    result.classList.remove("hidden");

    result.textContent =
      "کد باید دقیقاً ۶ رقم باشد.";

    return;
  }

  result.classList.remove("hidden");

  result.innerHTML =
    "<b>نتیجهٔ آزمایش</b><br><br>" +
    "کد واردشده: <b>" + enteredCode + "</b>" +
    "<br><br>" +
    "✅ این کد فقط داخل همین صفحه نمایش داده شد و هیچ‌جا ارسال نشد.";

});


// برگشت
document.getElementById("back").addEventListener("click", function() {

  codePage.classList.add("hidden");

  phonePage.classList.remove("hidden");

  code.value = "";

  result.classList.add("hidden");

  phone.focus();

});

</script>

</body>
</html>
