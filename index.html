<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberLab — Login Simulation</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f0f2f5;
  color:#111;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  width:92%;
  max-width:420px;
  background:#fff;
  padding:32px 28px;
  border-radius:16px;
  box-shadow:0 8px 30px rgba(0,0,0,.12);
  text-align:center;
}

.logo{
  width:70px;
  height:70px;
  margin:0 auto 20px;
  border-radius:50%;
  background:#25d366;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:bold;
}

h1{
  margin:0 0 8px;
  font-size:25px;
}

.subtitle{
  color:#667781;
  font-size:14px;
  margin-bottom:25px;
  line-height:1.7;
}

.notice{
  background:#fff8df;
  border:1px solid #f0df9b;
  padding:11px;
  border-radius:9px;
  font-size:12px;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ccd0d5;
  border-radius:9px;
  font-size:16px;
  margin-bottom:12px;
  outline:none;
  text-align:center;
}

input:focus{
  border-color:#25d366;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:9px;
  background:#25d366;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.hidden{
  display:none;
}

.back{
  background:#eef1f3;
  color:#333;
  margin-top:10px;
}

.message{
  margin-top:18px;
  padding:14px;
  border-radius:9px;
  background:#e8f5e9;
  line-height:1.8;
  font-size:14px;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">C</div>

  <h1>CyberLab</h1>

  <div class="subtitle">
    شبیه‌ساز آموزشی ورود دو مرحله‌ای
  </div>

  <div class="notice">
    ⚠️ این یک آزمایش امنیتی است.<br>
    هیچ شماره یا کدی ذخیره یا ارسال نمی‌شود.
  </div>

  <!-- مرحله اول -->
  <section id="phoneStep">

    <input
      id="phone"
      type="tel"
      inputmode="tel"
      placeholder="شماره آزمایشی"
      autocomplete="off"
    >

    <button id="continueBtn" type="button">
      ادامه
    </button>

  </section>

  <!-- مرحله دوم -->
  <section id="codeStep" class="hidden">

    <p>
      یک کد ۶ رقمی آزمایشی وارد کن
    </p>

    <input
      id="code"
      type="text"
      inputmode="numeric"
      maxlength="6"
      placeholder="------"
      autocomplete="off"
    >

    <button id="verifyBtn" type="button">
      تأیید
    </button>

    <button id="backBtn" class="back" type="button">
      برگشت
    </button>

  </section>

  <div id="result" class="message hidden"></div>

</div>

<script>
const phoneStep = document.getElementById("phoneStep");
const codeStep = document.getElementById("codeStep");
const phone = document.getElementById("phone");
const code = document.getElementById("code");
const result = document.getElementById("result");

document.getElementById("continueBtn").addEventListener("click", () => {

  if (!phone.value.trim()) {
    alert("لطفاً یک شماره آزمایشی وارد کن.");
    return;
  }

  phoneStep.classList.add("hidden");
  codeStep.classList.remove("hidden");
  code.focus();
});

document.getElementById("verifyBtn").addEventListener("click", () => {

  const value = code.value.trim();

  if (!/^\d{6}$/.test(value)) {
    alert("کد آزمایشی باید دقیقاً ۶ رقم باشد.");
    return;
  }

  codeStep.classList.add("hidden");
  result.classList.remove("hidden");

  result.innerHTML =
    "✅ آزمایش با موفقیت انجام شد.<br><br>" +
    "این صفحه هیچ شماره یا کدی را ذخیره یا ارسال نکرد.";
});

document.getElementById("backBtn").addEventListener("click", () => {

  codeStep.classList.add("hidden");
  phoneStep.classList.remove("hidden");
  code.value = "";
  phone.focus();
});
</script>

</body>
</html>
