<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberLab Lab</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef1f4;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  width: 90%;
  max-width: 400px;
  background: white;
  padding: 28px;
  border-radius: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,.12);
  text-align: center;
}

.logo {
  width: 65px;
  height: 65px;
  margin: auto;
  margin-bottom: 18px;
  border-radius: 50%;
  background: #25d366;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: bold;
}

.subtitle {
  color: #667781;
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 22px;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border: 1px solid #ccd0d5;
  border-radius: 9px;
  font-size: 17px;
  text-align: center;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 9px;
  background: #25d366;
  color: white;
  font-size: 16px;
}

.hidden {
  display: none;
}

.demo-code {
  background: #f0f2f5;
  padding: 12px;
  border-radius: 9px;
  margin-bottom: 15px;
  font-size: 22px;
  letter-spacing: 4px;
}

.message {
  margin-top: 15px;
  line-height: 1.8;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">C</div>

  <h2>CyberLab</h2>

  <div class="subtitle">
    شبیه‌ساز آموزشی امنیت
  </div>

  <!-- مرحله شماره -->
  <div id="phonePage">

    <input
      id="phone"
      type="tel"
      inputmode="numeric"
      placeholder="شماره آزمایشی"
    >

    <button onclick="createCode()">
      ادامه
    </button>

  </div>


  <!-- مرحله کد -->
  <div id="codePage" class="hidden">

    <div class="subtitle">
      این یک کد ساختگی برای آزمایش است:
    </div>

    <div class="demo-code" id="demoCode"></div>

    <input
      id="code"
      type="text"
      inputmode="numeric"
      maxlength="6"
      placeholder="کد ۶ رقمی"
    >

    <button onclick="checkCode()">
      تأیید آزمایشی
    </button>

    <div class="message" id="message"></div>

  </div>

</div>


<script>

let generatedCode = "";

function createCode() {

  const phone = document.getElementById("phone").value.trim();

  if (phone === "") {
    alert("لطفاً یک شماره آزمایشی وارد کن.");
    return;
  }

  // تولید کد کاملاً ساختگی
  generatedCode =
    Math.floor(100000 + Math.random() * 900000).toString();

  document.getElementById("demoCode").textContent =
    generatedCode;

  document.getElementById("phonePage")
    .classList.add("hidden");

  document.getElementById("codePage")
    .classList.remove("hidden");
}


function checkCode() {

  const entered =
    document.getElementById("code").value.trim();

  const message =
    document.getElementById("message");

  if (entered === generatedCode) {

    message.innerHTML =
      "✅ آزمایش موفق شد.<br>" +
      "کد ساختگی درست بود.";

  } else {

    message.innerHTML =
      "❌ کد اشتباه است.<br>" +
      "دوباره امتحان کن.";

  }

}

</script>

</body>
</html>
