<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberLab Admin</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef1f4;
  padding: 30px;
}

.panel {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 5px 25px rgba(0,0,0,.12);
}

h1 {
  margin-top: 0;
}

.item {
  background: #f5f6f7;
  padding: 15px;
  margin-top: 12px;
  border-radius: 10px;
}

.label {
  color: #667781;
  font-size: 13px;
}

.value {
  font-size: 18px;
  margin-top: 5px;
}
</style>
</head>

<body>

<div class="panel">

<h1>CyberLab 🛡️</h1>

<p>پنل آزمایش آموزشی</p>

<div class="item">
  <div class="label">شماره آزمایشی</div>
  <div class="value">0700000000</div>
</div>

<div class="item">
  <div class="label">کد آزمایشی</div>
  <div class="value">482913</div>
</div>

<div class="item">
  <div class="label">وضعیت</div>
  <div class="value">✅ آزمایش موفق</div>
</div>

</div>

</body>
</html>
