<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CyberLab Admin</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef1f4;
  padding:25px;
}

.panel{
  max-width:600px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.12);
}

h1{
  margin-top:0;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.box{
  background:#f5f6f7;
  padding:18px;
  border-radius:12px;
}

.number{
  font-size:28px;
  font-weight:bold;
  margin-top:8px;
}

.test{
  margin-top:20px;
  padding:18px;
  border-radius:12px;
  background:#e8f5e9;
}

.status{
  color:green;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="panel">

<h1>🛡️ CyberLab</h1>

<p>داشبورد لاب آموزشی امنیت</p>

<div class="stats">

<div class="box">
آزمایش‌ها
<div class="number">1</div>
</div>

<div class="box">
موفق
<div class="number">1</div>
</div>

</div>

<div class="test">

<b>Test #001</b>

<br><br>

نوع آزمایش:
<br>
OTP Simulation

<br><br>

وضعیت:
<span class="status">موفق ✅</span>

<br><br>

این آزمایش هیچ OTP واقعی را دریافت یا ذخیره نکرده است.

</div>

</div>

</body>
</html>
